<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 1. Character Encoding (Must be within the first 1024 bytes) -->
    <meta charset="UTF-8">

    <!-- 2. Mobile Responsive Viewport Settings -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 3. Page Title (Seen in browser tabs and search results) -->
    <title>My Website Title</title>

    <!-- 4. SEO & Social Metadata -->
    <meta name="description" content="A comprehensive guide to HTML.">
    <meta name="author" content="John Doe">

    <!-- 5. Connections & Stylesheets -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">

    <!-- 6. Scripts (Deferred to prevent rendering blocks) -->
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Visible Page Content Goes Here</h1>
</body>
</html>
